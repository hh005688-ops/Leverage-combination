<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>槓桿組合比對</title>
<style>
:root {
  --bg: #eef0f2; --card: #ffffff; --text: #1d2a2e; --muted: #64757b; --line: #d9dfe2;
  --accent: #0f5f66; --accent-text: #ffffff; --accent-soft: #dcefef;
  --danger: #c0392b; --danger-soft: #fbe5e2; --input: #f7f9fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181a; --card: #1b2427; --text: #e4ecee; --muted: #8fa3a8; --line: #2c393d;
    --accent: #3cc3c9; --accent-text: #08282b; --accent-soft: #1f3d40;
    --danger: #ff7a6b; --danger-soft: #45201c; --input: #121a1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 4px 0 12px; }
h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { flex: 1; padding: 10px 4px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; font-size: 15px; cursor: pointer; }
.tab.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.f { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.f > span { font-size: 12px; color: var(--muted); }
input, select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); color: var(--text); font: inherit; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.val { padding: 8px 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.btn { padding: 8px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); border-radius: 8px; font: inherit; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.del { border-color: var(--line); color: var(--muted); background: transparent; padding: 8px 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.hint { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.err { color: var(--danger); font-weight: 600; }
.warn { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 6px 8px; font-weight: 600; }
.ok { color: var(--accent); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider input[type=range] { padding: 0; accent-color: var(--accent); flex: 1; }
.fx { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
.fx input { width: 90px; }
.sub { font-size: 11px; color: var(--muted); display: block; }
.mini { width: auto; padding: 2px 4px; font-size: 12px; margin-left: 6px; }
.blk { padding-top: 6px; }
.blk + .blk { border-top: 2px solid var(--line); margin-top: 8px; }
.blk-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
h3 { font-size: 15px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.subtotal { font-size: 13px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
table.cmp { width: 100%; border-collapse: collapse; }
table.cmp th, table.cmp td { padding: 8px 4px; white-space: nowrap; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; vertical-align: top; }
table.cmp th:first-child { white-space: normal; width: 24%; text-align: left; color: var(--muted); font-weight: 400; font-size: 13px; }
@media (max-width: 520px) { table.cmp { font-size: 12.5px; } .card { padding: 12px 10px; } }
table.cmp thead th { border-top: 0; color: var(--accent); font-weight: 600; }
.badge { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 6px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>槓桿組合比對</h1>
  <div class="tabs" id="tabs"></div>
  <div class="fx">
    <span>美元匯率（美股換算台幣）1 USD =</span>
    <input type="number" id="fx" step="any" min="0">
    <span>TWD</span>
    <span id="status"></span>
  </div>
  <div id="main"></div>
  <p class="hint">資料只存在你這台裝置的瀏覽器（localStorage），不會上傳到伺服器。報價僅供參考，非投資建議。</p>
</div>

<script>
'use strict';
const KEY = 'leverage-combo-v1';
const NAMES = ['A', 'B', 'C'];
const DEBT_TYPES = ['信貸', '房貸', '券商質押', '其他'];
const VIEWS = [...NAMES, 'CMP'];
const AMORT_TYPES = ['信貸', '房貸']; // 只有這兩類有期數與每月本利攤還

const newPortfolio = () => ({ h: [], d: [], alarm: 130, drop: 10 });
let S = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.P) return normalize(s);
  } catch (e) { /* 無法讀取就用預設 */ }
  return { active: 'A', fx: 32, P: { A: newPortfolio(), B: newPortfolio(), C: newPortfolio() } };
}
// 舊資料沿用：補上持股所屬市場（台股/美股）；負債的類型欄位本來就有
function guessMarket(h) {
  if (h.q && h.q.currency) return h.q.currency === 'TWD' ? 'TW' : 'US';
  const sym = h.sym || '';
  if (/^\d{4,6}[A-Z]?$/.test(sym) || /\.TWO?$/.test(sym)) return 'TW';
  return sym ? 'US' : 'TW';
}
function normalize(s) {
  s.P = s.P || {};
  NAMES.forEach(n => {
    const p = s.P[n] = Object.assign(newPortfolio(), s.P[n] || {});
    if (!Array.isArray(p.h)) p.h = [];
    if (!Array.isArray(p.d)) p.d = [];
    p.h.forEach(h => { if (h.m !== 'TW' && h.m !== 'US') h.m = guessMarket(h); });
    p.d.forEach(d => { if (!DEBT_TYPES.includes(d.type)) d.type = '其他'; });
  });
  if (!VIEWS.includes(s.active)) s.active = 'A';
  if (s.fx == null) s.fx = 32;
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 忽略 */ } }
const cur = () => S.P[S.active];

// ---------- 小工具 ----------
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}
const field = (label, node) => el('label', { class: 'f' }, el('span', {}, label), node);
const num = v => (v === '' || v == null || isNaN(Number(v))) ? 0 : Number(v);
const fmt = (n, d = 0) => Number.isFinite(n) ? n.toLocaleString('zh-TW', { maximumFractionDigits: d, minimumFractionDigits: d }) : '—';
const twd = n => 'NT$ ' + fmt(n);

// ---------- 計算 ----------
function currencyFactor(c) {
  if (c === 'TWD') return 1;
  if (c === 'USD') return num(S.fx) || 0;
  return null;
}

// 依標的名稱判斷槓桿倍數（規則同 Google 試算表，不分大小寫）；僅用於顯示，不參與計算
function detectLev(name) {
  const n = String(name || '').trim();
  if (/正2|正二|2倍|2x/i.test(n) || /l$/i.test(n)) return 2;
  if (/3倍|3x/i.test(n)) return 3;
  return 1;
}

function calcHolding(h) {
  if (!h.sym) return { st: 'empty' };
  if (!h.q || h.q.in !== h.sym) return { st: 'pending' };
  if (h.q.err) return { st: 'err' };
  const f = currencyFactor(h.q.currency);
  if (f === null) return { st: 'err', msg: '不支援幣別 ' + h.q.currency };
  const mv = num(h.shares) * h.q.price * f;
  const pledged = h.m === 'US' ? 0 : num(h.pShares) * h.q.price * f; // 美股不質押，舊資料殘留的質押股數不計
  const lev = h.ov ? Number(h.ov) : detectLev(h.q.name);
  return { st: 'ok', name: h.q.name, price: h.q.price, cur: h.q.currency, mv, pledged, lev, beta: h.q.beta, fb: h.q.fb, bm: h.q.bm };
}

// 本息平均攤還；期數留空則只算利息
function monthlyPayment(d) {
  const P = num(d.amt), r = num(d.rate) / 100 / 12, n = Math.round(num(d.n));
  if (P <= 0) return 0;
  if (n <= 0) return P * r;
  if (r === 0) return P / n;
  const g = Math.pow(1 + r, n);
  return P * r * g / (g - 1);
}

function compute(p) {
  const hs = p.h.map(calcHolding);
  let assets = 0, wb = 0;
  hs.forEach(c => { if (c.st === 'ok') { assets += c.mv; wb += c.mv * c.beta; } });
  // 券商質押維持率 ＝ 所有持股的質押股票市值 ÷ 券商質押借款總額
  let pledgeValue = 0;
  hs.forEach(c => { if (c.st === 'ok') pledgeValue += c.pledged; });
  const pledgeLoan = p.d.filter(d => d.type === '券商質押').reduce((t, d) => t + num(d.amt), 0);
  const ratio = pledgeLoan > 0 && pledgeValue > 0 ? pledgeValue / pledgeLoan * 100 : null;
  const debts = p.d.map(d => ({ pay: AMORT_TYPES.includes(d.type) ? monthlyPayment(d) : 0 }));
  const liab = p.d.reduce((t, d) => t + num(d.amt), 0);
  const net = assets - liab;
  return {
    hs, debts, assets, liab, net, ratio,
    leverage: net > 0 ? assets / net : 1,
    beta: assets > 0 ? wb / assets : null,
    monthly: debts.reduce((s, x) => s + x.pay, 0),
  };
}

// ---------- 畫面 ----------
let refs = {};
const TABS = [...NAMES.map(n => ({ id: n, label: '組合 ' + n })), { id: 'CMP', label: '比對結果' }];
const HOLD_BLOCKS = [{ m: 'TW', title: '台股', ph: '0050' }, { m: 'US', title: '美股', ph: 'QQQM' }];
const stat = (label, value) => el('div', { class: 'stat' }, el('small', {}, label), el('b', {}, value));

function renderTabs() {
  const box = document.getElementById('tabs');
  box.replaceChildren(...TABS.map(t => el('button', {
    class: 'tab' + (t.id === S.active ? ' on' : ''),
    onclick: () => { S.active = t.id; save(); renderAll(); },
  }, t.label)));
}

function renderAll() {
  renderTabs();
  document.getElementById('fx').value = S.fx;
  if (S.active === 'CMP') renderCompare(); else renderPortfolio();
}

function renderPortfolio() {
  const p = cur();
  refs = { h: [], d: [], holdBox: {}, debtBox: {}, debtSub: {} };

  const holdCard = el('div', { class: 'card' }, el('h2', {}, '持股'));
  HOLD_BLOCKS.forEach(b => {
    refs.holdBox[b.m] = el('div');
    holdCard.append(el('div', { class: 'blk' },
      el('div', { class: 'blk-h' },
        el('h3', {}, b.title),
        el('button', { class: 'btn ghost', onclick: () => { p.h.push({ sym: '', shares: '', pShares: '', ov: '', m: b.m }); save(); renderHoldings(); } }, '＋ 新增持股')),
      refs.holdBox[b.m]));
  });
  holdCard.append(
    el('div', { class: 'bar' }, refs.updBtn = el('button', { class: 'btn', onclick: () => updateQuotes([S.active]) }, '更新報價')),
    el('p', { class: 'hint' }, '只要輸入代碼與庫存股數（有券商質押再填質押股數），其餘自動帶出。槓桿倍數依標的名稱判斷，判斷錯可用「覆蓋」改；僅作標示，槓桿型 ETF 的 Beta 已含槓桿，不會再乘一次。'));

  const debtCard = el('div', { class: 'card' }, el('h2', {}, '負債'));
  DEBT_TYPES.forEach(t => {
    refs.debtBox[t] = el('div');
    refs.debtSub[t] = el('span', { class: 'subtotal' });
    debtCard.append(el('div', { class: 'blk' },
      el('div', { class: 'blk-h' },
        el('h3', {}, t, refs.debtSub[t]),
        el('button', { class: 'btn ghost', onclick: () => { p.d.push({ type: t, bank: '', amt: '', rate: '', n: '' }); save(); renderDebts(); } }, '＋ 新增' + t)),
      refs.debtBox[t]));
  });
  debtCard.append(
    refs.monthly = el('p', { class: 'hint' }),
    el('p', { class: 'hint' }, '信貸、房貸每月攤還採本息平均攤還，期數留空則只算每月利息；券商質押與其他只記借款金額與利率，不算攤還。券商質押維持率 ＝ 持股區填的質押股票市值 ÷ 券商質押借款金額。'),
    el('div', { class: 'bar' },
      field('維持率警戒線（%）', el('input', { type: 'number', step: 'any', value: p.alarm, oninput: e => { p.alarm = num(e.target.value); save(); refresh(); } }))));

  const dropCard = el('div', { class: 'card' },
    el('h2', {}, '大盤下跌模擬'),
    el('div', { class: 'slider' },
      el('input', { type: 'range', min: 0, max: 30, step: 1, value: p.drop, oninput: e => { p.drop = num(e.target.value); save(); refresh(); } }),
      refs.dropLabel = el('b', {})),
    refs.dropOut = el('div', { class: 'stats', style: 'margin-top:10px' }),
    el('p', { class: 'hint' }, '淨值變動 ＝ 總資產 × Beta × 跌幅 ÷ 淨值。總資產先扣掉負債後才除以淨值，所以借越多、風險越大。'));

  const sumCard = el('div', { class: 'card' },
    el('h2', {}, '組合 ' + S.active + ' 摘要'),
    refs.stats = el('div', { class: 'stats' }),
    refs.note = el('p', { class: 'hint' }));

  document.getElementById('main').replaceChildren(holdCard, debtCard, dropCard, sumCard);
  renderHoldings();
  renderDebts();
}

function holdingRow(p, h, i, ph) {
  const r = {};
  refs.h[i] = r;
  return el('div', { class: 'row' },
    field('代碼', el('input', { value: h.sym, placeholder: ph, autocapitalize: 'characters',
      oninput: e => { h.sym = e.target.value.trim().toUpperCase(); save(); refresh(); } })),
    field('庫存股數', el('input', { type: 'number', inputmode: 'decimal', step: 'any', min: 0, value: h.shares,
      oninput: e => { h.shares = e.target.value; save(); refresh(); } })),
    h.m !== 'US' && field('質押股數', el('input', { type: 'number', inputmode: 'decimal', step: 'any', min: 0, value: h.pShares || '',
      oninput: e => { h.pShares = e.target.value; save(); refresh(); } })),
    field('標的名稱', r.name = el('div', { class: 'val' })),
    field('現價', r.price = el('div', { class: 'val' })),
    field('市值（台幣）', r.mv = el('div', { class: 'val' })),
    field('權重', r.weight = el('div', { class: 'val' })),
    field('槓桿倍數', el('div', { class: 'val' }, r.lev = el('b'),
      el('select', { class: 'mini', title: '手動覆蓋', onchange: e => { h.ov = e.target.value; save(); refresh(); } },
        el('option', { value: '' }, '自動'),
        ...[1, 2, 3].map(v => el('option', { value: v, ...(String(h.ov) === String(v) ? { selected: '' } : {}) }, '覆蓋 ' + v + 'x'))))),
    field('Beta', r.beta = el('div', { class: 'val' })),
    el('button', { class: 'btn del', title: '刪除', onclick: () => { p.h.splice(i, 1); save(); renderAll(); } }, '✕'));
}

function renderHoldings() {
  const p = cur();
  refs.h = [];
  HOLD_BLOCKS.forEach(b => {
    refs.holdBox[b.m].replaceChildren(...p.h.map((h, i) => h.m === b.m ? holdingRow(p, h, i, b.ph) : null).filter(Boolean));
  });
  refresh();
}

function debtRow(p, d, i) {
  const r = {};
  refs.d[i] = r;
  const upd = k => e => { d[k] = e.target.value; save(); refresh(); };
  const amort = AMORT_TYPES.includes(d.type);
  return el('div', { class: 'row' },
    field('銀行 / 券商', el('input', { value: d.bank, placeholder: '名稱', oninput: e => { d.bank = e.target.value; save(); } })),
    field('借款金額', el('input', { type: 'number', inputmode: 'decimal', step: 'any', min: 0, value: d.amt, oninput: upd('amt') })),
    field('年利率（%）', el('input', { type: 'number', inputmode: 'decimal', step: 'any', min: 0, value: d.rate, oninput: upd('rate') })),
    amort && field('期數（月）', el('input', { type: 'number', inputmode: 'numeric', step: 1, min: 0, value: d.n, oninput: upd('n') })),
    amort && field('每月本利攤還', r.pay = el('div', { class: 'val' })),
    d.type === '券商質押' && field('維持率（全部質押）', r.ratio = el('div', { class: 'val' })),
    el('button', { class: 'btn del', title: '刪除', onclick: () => { p.d.splice(i, 1); save(); renderAll(); } }, '✕'));
}

function renderDebts() {
  const p = cur();
  refs.d = [];
  DEBT_TYPES.forEach(t => {
    refs.debtBox[t].replaceChildren(...p.d.map((d, i) => d.type === t ? debtRow(p, d, i) : null).filter(Boolean));
  });
  refresh();
}

// 只更新計算出來的數字，不重建輸入框（避免打字時失去焦點）
function refresh() {
  const p = cur();
  const c = compute(p);

  c.hs.forEach((x, i) => {
    const r = refs.h[i];
    if (!r) return;
    r.name.className = r.price.className = r.mv.className = r.beta.className = 'val';
    if (x.st === 'ok') {
      r.name.textContent = x.name;
      r.weight.textContent = c.assets > 0 ? fmt(x.mv / c.assets * 100, 1) + '%' : '—';
      r.lev.textContent = x.lev + ' 倍';
      r.price.textContent = fmt(x.price, 2) + ' ' + x.cur;
      r.mv.textContent = twd(x.mv);
      r.beta.textContent = fmt(x.beta, 3) + (x.fb ? '（預設）' : '');
      const bmName = x.bm === '^TWII' ? '加權' : x.bm === '^GSPC' ? 'S&P 500' : '';
      if (bmName) r.beta.append(el('small', { class: 'sub' }, '對照 ' + bmName));
    } else {
      r.name.textContent = x.st === 'err' ? (x.msg || '查無資料') : x.st === 'pending' ? '尚未更新報價' : '';
      if (x.st === 'err') r.name.className = 'val err';
      r.price.textContent = r.mv.textContent = r.beta.textContent = r.weight.textContent = r.lev.textContent = '—';
    }
  });

  c.debts.forEach((x, i) => {
    const r = refs.d[i];
    if (!r) return;
    if (r.pay) r.pay.textContent = twd(x.pay);
    if (r.ratio) {
      if (c.ratio == null) {
        r.ratio.className = 'val';
        r.ratio.textContent = '請在持股填質押股數並更新報價';
      } else {
        const low = c.ratio < num(p.alarm);
        r.ratio.className = low ? 'val warn' : 'val ok';
        r.ratio.textContent = fmt(c.ratio, 1) + '%' + (low ? ' ⚠ 低於警戒 ' + fmt(num(p.alarm), 0) + '%' : '');
      }
    }
  });

  DEBT_TYPES.forEach(t => {
    const sum = p.d.filter(d => d.type === t).reduce((s, d) => s + num(d.amt), 0);
    refs.debtSub[t].textContent = '小計 ' + twd(sum);
  });
  refs.monthly.textContent = '每月本利攤還合計（信貸＋房貸）：' + twd(c.monthly);

  refs.stats.replaceChildren(
    stat('總資產', twd(c.assets)),
    stat('總負債', twd(c.liab)),
    stat('組合淨值', twd(c.net)),
    stat('實際槓桿', fmt(c.leverage, 2) + ' 倍'),
    stat('總資產 Beta（市值加權）', c.beta == null ? '—' : fmt(c.beta, 3)));
  const bad = c.hs.filter(x => x.st === 'err').length;
  const pend = c.hs.filter(x => x.st === 'pending').length;
  refs.note.textContent = (bad ? bad + ' 檔查無資料，未列入計算。' : '') + (pend ? pend + ' 檔尚未更新報價。' : '') +
    (c.net <= 0 && c.assets > 0 ? '淨值 ≤ 0，實際槓桿以 1 倍顯示。' : '');

  // 下跌拉桿
  const drop = num(p.drop) / 100;
  refs.dropLabel.textContent = '大盤下跌 ' + fmt(num(p.drop), 0) + '%';
  refs.dropOut.replaceChildren();
  if (c.beta == null || c.net <= 0) {
    refs.dropOut.append(el('div', { class: 'hint' }, c.net <= 0 && c.assets > 0 ? '淨值 ≤ 0，無法模擬。' : '請先輸入持股並更新報價。'));
  } else {
    const loss = c.assets * c.beta * drop; // 資產損失金額（負債不變）
    const pct = loss / c.net * 100;
    const after = c.net - loss;
    refs.dropOut.append(
      stat('淨值變動', (loss > 0 ? '−' : '') + fmt(pct, 1) + '%'),
      stat('資產損失', loss > 0 ? '−' + twd(loss) : twd(0)),
      stat('下跌後淨值', after < 0 ? '⚠ ' + twd(after) : twd(after)));
  }
}

// ---------- 比對結果 ----------
function renderCompare() {
  refs = {};
  const cols = NAMES.map(n => compute(S.P[n]));
  const DROP = 0.1;
  const dropCell = c => {
    if (c.beta == null || c.net <= 0) return '—';
    const loss = c.assets * c.beta * DROP;
    return el('span', {}, (loss > 0 ? '−' : '') + fmt(loss / c.net * 100, 1) + '%',
      el('small', { class: 'sub' }, (loss > 0 ? '−' : '') + twd(loss)));
  };
  const rows = [
    ['總資產', c => twd(c.assets)],
    ['總負債', c => twd(c.liab)],
    ['組合淨值', c => twd(c.net)],
    ['實際槓桿倍數', c => fmt(c.leverage, 2) + ' 倍'],
    ['總資產 Beta', c => c.beta == null ? '—' : fmt(c.beta, 3)],
    ['每月本利攤還（信貸＋房貸）', c => twd(c.monthly)],
    ['大盤下跌 10% 時淨值變動', dropCell],
  ];
  document.getElementById('main').replaceChildren(el('div', { class: 'card' },
    el('h2', {}, '三個組合比對'),
    el('table', { class: 'cmp' },
      el('thead', {}, el('tr', {}, el('th', {}, ''), ...NAMES.map(n => el('th', {}, '組合 ' + n)))),
      el('tbody', {}, ...rows.map(([label, f]) => el('tr', {}, el('th', {}, label), ...cols.map(c => el('td', {}, f(c))))))),
    el('div', { class: 'bar' }, refs.updBtn = el('button', { class: 'btn', onclick: () => updateQuotes(NAMES) }, '更新三個組合報價')),
    el('p', { class: 'hint' }, '數字取自各組合最近一次更新的報價；大盤下跌 10% 的算法同組合頁的下跌模擬。')));
}

// ---------- 報價 ----------
async function updateQuotes(names) {
  const ps = names.map(n => S.P[n]);
  const syms = [...new Set(ps.flatMap(p => p.h.map(h => h.sym)).filter(Boolean))];
  const status = document.getElementById('status');
  if (!syms.length) { status.textContent = '請先輸入代碼'; return; }
  refs.updBtn.disabled = true;
  status.textContent = '更新中…';
  try {
    const r = await fetch('/api/quote?symbols=' + encodeURIComponent(syms.join(',')));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const bySym = {};
    (data.results || []).forEach(x => { bySym[x.symbol] = x; });
    ps.forEach(p => p.h.forEach(h => {
      if (!h.sym) return;
      const x = bySym[h.sym];
      if (!x || x.error || !(x.price > 0)) h.q = { in: h.sym, err: true };
      else h.q = { in: h.sym, name: x.name, price: x.price, currency: x.currency, beta: x.beta == null ? 1 : x.beta, fb: !!x.betaFallback, bm: x.benchmark };
    }));
    if (data.usdtwd > 0) S.fx = Number(data.usdtwd.toFixed(3));
    save();
    status.textContent = '已更新 ' + new Date().toLocaleTimeString('zh-TW');
    renderAll();
  } catch (e) {
    status.textContent = '更新失敗，請稍後再試';
  } finally {
    if (refs.updBtn) refs.updBtn.disabled = false;
  }
}

document.getElementById('fx').addEventListener('input', e => { S.fx = e.target.value; save(); refresh(); });
renderAll();
</script>
